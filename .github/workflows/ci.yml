name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engines:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Engine self-tests (24 invariants)
        run: |
          for f in tests/test_*.js; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
