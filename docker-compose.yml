version: '3.8'

services:
  omnitax-engines:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => { if (r.statusCode !== 200) throw new Error(r.statusCode); })"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - .:/app
      - /app/node_modules

# Quick start:
#   docker-compose up
# 
# Then curl:
#   curl http://localhost:3000/
#   curl -X POST http://localhost:3000/api/v1/math/calculate-breakdown \
#     -H "Content-Type: application/json" \
#     -d '{"baseHt": "1000", "taxRatePct": 22, "currency": "EUR"}'
